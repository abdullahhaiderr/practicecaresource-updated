name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - audit/brand-accessibility-seo

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const audit = require('./npm-audit.json'); console.log(JSON.stringify(audit.vulnerabilities ?? {}, null, 2));"

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build
